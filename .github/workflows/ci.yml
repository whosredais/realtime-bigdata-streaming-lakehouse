name: Big Data Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest

    - name: Lint Code with Flake8
      run: |
        # Arrête le build si des erreurs de syntaxe Python critiques sont trouvées
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.idea,logs,dags
        # Avertissements de complexité
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=.idea,logs,dags

    - name: Run Test Suite
      run: |
        pytest tests/ -v
